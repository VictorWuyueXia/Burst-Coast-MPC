name: wsmpc  # Project environment name for conda 
channels:
  - conda-forge  # Use conda-forge channel for package installations
dependencies:
  - python=3.12        # Python version for this environment
  - numpy>=1.26        # Core numerical operations library
  - scipy>=1.11        # Scientific computing tools
  - casadi>=3.6        # Symbolic computation and automatic differentiation
  - pydantic>=2.6      # Data validation and settings management
  - omegaconf>=2.3     # Flexible hierarchical configuration system
  - typer>=0.12        # Build command line applications
  - rich>=13.7         # Pretty printing and formatting in terminal
  - psutil>=5.9        # System and process utilities
  - threadpoolctl>=3.5 # Thread pool control for libraries like numpy or scipy
  - matplotlib>=3.8    # Create static, animated, and interactive plots
  - pytest>=8.0        # Unit testing framework
  - ruff>=0.5          # Fast Python linter
  - mypy>=1.10         # Static type checker for Python
  - pip                # Python package manager
