artifacts:
  root-dir: artifacts/experiments
  alias: null
  enabled: true
experiment:
  run-id: pendulum_baseline
  episode-id: 0
  max-steps: 3000
  stop-on-goal: true
  initial-state:
    theta-rad: 1.57 # pi/2
    omega-rad-s: 0.0
coordinator:
  node-id: Coordinator
  mode: synchronous
  event-trigger: true
  decision-interval-steps: 1
  debug-log-every-n-steps: 1
environment:
  node-id: Environment
  simulation:
    timestep-s: 0.01
    pace-s: ${realtime:${environment.simulation.timestep-s}}
  pendulum:
    mass-kg: 1.0
    gravity-m-s2: 9.80665
    length-m: 1.0
    damping-nms: 0
    torque-limit-nm: 1.0
    theta-limit-abs-rad: 6.283 # 2pi
    omega-limit-abs-rad-s: 3.142 # pi
  goal:
    angle-tolerance-rad: 0.05
    omega-tolerance-rad-s: 0.05
    hold-steps: 5
mpc:
  controller: IP-dynamics-naturalPeriod
  split-ratios: [0.1, 0.2, 0.3]
runtime:
  node-id: Runtime
  max-worker-threads: 2
  blas-threads: 1
  cpu-affinity: []
  set-env: true
