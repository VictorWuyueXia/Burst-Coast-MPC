# This is a pyproject.toml file used for Python projects.
# It defines build, install, and dependency information recognized by modern Python packaging tools (e.g., pip, poetry, build, and setuptools).
# To use this file:
# - Place it at the root of your Python project directory.
# - Install the project locally with `pip install .` (for editable installs, use `pip install -e .`).
# - Tools like `pytest` and `ruff` will also pick up their configuration directly from this file.
# This file is for Python packaging, dependency management, and tool configuration in a unified, standardized way.
[build-system]
requires = ["setuptools==81.0.0", "wheel==0.47.0"]  # Build tools required for packaging
build-backend = "setuptools.build_meta"  # Backend used for building

# Main project metadata and dependencies
[project]
name = "burst-coast-mpc"  # Project name
version = "0.1.0"  # Project version
description = "Burst-coast model predictive control experiments."  # Short description
readme = "README.md"  # Project readme file
requires-python = "==3.12.13"  # Python version pinned to the shared conda environment
dependencies = [  # Core libraries needed to run the project
  "numpy==2.4.6",         # Numerical computing
  "scipy==1.17.1",        # Scientific computing
  "casadi==3.7.2",        # Automatic differentiation, numeric optimization
  "pydantic==2.13.4",     # Data validation/config schemas
  "omegaconf==2.3.0",     # Configuration management
  "typer==0.26.7",        # Command-line interface tools
  "rich==15.0.0",         # Pretty terminal formatting
  "matplotlib==3.10.9",   # Plotting and visualization
  "imageio-ffmpeg==0.6.0", # Bundled video encoder for portable replay exports
  "scikit-learn==1.9.0",  # Sparse regression and validation utilities
  "psutil==7.2.2",        # CPU and memory telemetry for validation runs
  "torch==2.11.0",        # Tensor backend for offline critic training
  "pytorch-lightning==2.6.5",  # Training loop orchestration for critic fitting
]

# Development-only dependencies (not needed by end users)
[project.optional-dependencies]
dev = [
  "pytest==9.0.3",   # Testing framework
  "ruff==0.15.17",   # Linter for code quality
  "mypy==2.1.0",     # Static type checking
]
jax = [
  "jax==0.11.2",     # CPU development and numerical validation
  "flax==0.12.10",   # Functional neural-network modules for the JAX Q critic
  "optax==0.2.8",    # JAX optimizer and gradient-transformation library
]
jax-cuda13 = [
  "jax[cuda13]==0.11.2",  # Linux accelerator execution with pip-provided CUDA 13
  "flax==0.12.10",         # Functional neural-network modules for the JAX Q critic
  "optax==0.2.8",          # JAX optimizer and gradient-transformation library
]

# Define command-line script entry point for easy CLI usage
[project.scripts]
bcmpc = "bcmpc:main"  # Run the root command interface with `bcmpc`

# Configure how setuptools finds the packages
[tool.setuptools]
py-modules = ["bcmpc"]

[tool.setuptools.packages.find]
where = ["src", "."]         # Look in the src folder and root
include = ["bringup*", "inverted_pendulum*", "rotary_pendulum*", "CR3BP*"]  # Include runtime and task packages

[tool.setuptools.package-data]
inverted_pendulum = ["configs/*.yaml"]  # Ship task configs
rotary_pendulum = ["configs/*.yaml", "configs/*.json"]  # Ship rotary-pendulum task configs

# Pytest configuration for where to find code and tests
[tool.pytest.ini_options]
pythonpath = ["src", "."]    # Add source folders to module path
testpaths = ["tests"]        # Directory containing tests

# Ruff linter configuration
[tool.ruff]
line-length = 100            # Max line length for code formatting
target-version = "py312"     # Target Python version (3.12)

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # Enable common code quality, formatting, and upgrade checks

# Mypy static analysis configuration
[tool.mypy]
python_version = "3.12"      # Python version for analysis
strict = true                # Enforce strict type checking rules
warn_unreachable = true      # Warn on code that cannot be reached

[[tool.mypy.overrides]]
module = ["optax", "optax.*"]
ignore_missing_imports = true  # Optax 0.2.8 does not publish a py.typed marker
