ppo:
  action-repeat-steps: 5
  parallel-environments: 64
  rollout-steps: 256
  minibatch-size: 1024
  optimization-epochs: 8
  curriculum-decisions: [500000, 1500000, 1000000]
  initialization-bounds:
    near-upright: [-0.15, 0.15, -0.35, 0.35, -1.0, 1.0, -2.0, 2.0]
    downward-noise: [-0.10, 0.10, -0.05, 0.05, -0.5, 0.5, -0.5, 0.5]
    phase: [-0.25, 0.25, -3.141592653589793, 3.141592653589793, -2.0, 2.0, -10.680345, 10.680345]
  stage-b-downward-fraction: 0.5
  stage-c-exact-fraction: 0.8
  discount-time-constant-s: 5.0
  gae-lambda: 0.95
  policy-clip: 0.2
  value-loss-weight: 0.5
  entropy-weight: 0.001
  initial-learning-rate: 0.0003
  final-learning-rate: 0.00003
  adam-epsilon: 0.00001
  maximum-gradient-norm: 0.5
  target-kl: 0.015
  initial-log-standard-deviation: -0.5
  phase-weight: 0.05
  torque-slew-weight: 0.002
  torque-effort-weight: 0.0005
  arm-boundary-weight: 0.02
  success-bonus: 5.0
  arm-failure-penalty: 5.0
  timeout-penalty: 2.0
  evaluation-episodes: 100
  evaluation-hold-steps: 125
  evaluation-every-updates: 10
  random-seed: 20260825
  artifact-root: artifacts/rotary_pendulum/ppo-training
  device: cpu
