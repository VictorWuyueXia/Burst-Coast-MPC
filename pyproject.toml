[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wake-sleep-mpc"
version = "0.1.0"
description = "Wake-sleep model predictive control experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "omegaconf>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "psutil>=5.9",
  "threadpoolctl>=3.5",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
wsmpc = "wsmpc.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["wsmpc*", "configs*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
