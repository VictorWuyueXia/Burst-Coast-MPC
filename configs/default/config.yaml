logging:
  level: INFO
artifacts:
  root-dir: artifacts/experiments
  alias: null
  enabled: true
experiment:
  run-id: pendulum_baseline
  global-seed: 32
  episode-id: 0
  max-steps: 25
  stop-on-goal: true
  initial-state:
    theta-rad: 0.0
    omega-rad-s: 0.0
  default-action:
    u-nm: 0.0
    source: zero_torque
coordinator:
  node-id: Coordinator
  mode: synchronous
  decision-interval-steps: 1
  debug-log-every-n-steps: 1
environment:
  node-id: Environment
  simulation:
    timestep-s: 0.01
    pace-s: ${realtime:${environment.simulation.timestep-s}}
    max-rollout-steps: 10000
  pendulum:
    mass-kg: 1.0
    gravity-m-s2: 9.80665
    length-m: 1.0
    damping-nms: 0.05
    torque-limit-nm: 4.0
    theta-limit-abs-rad: 12.566370614359172
    omega-limit-abs-rad-s: 40.0
  goal:
    angle-tolerance-rad: 0.05
    omega-tolerance-rad-s: 0.05
    hold-steps: 25
mpc:
  enabled: false
  split-ratios: [0.1, 0.2, 0.3]
  solve-candidates-in-parallel: false
  max-parallel-workers: null
  horizon-steps-override: null
  prediction-horizon-rule: half-natural-period
  coast-mode: zero
  solver: ipopt
  ipopt-print-level: 0
  solver-max-iterations: 100
  solver-tolerance: 1.0e-6
  cost:
    epsilon-phi: 1.0e-6
    sigma-energy: 0.5
    q-energy: 1.0
    q-phase: 0.0
    q-local: 0.0
    q-terminal: 5.0
    rho-saturation: 0.0
    rho-delta-u: 1.0e-3
    q-phase-diag: [1.0, 1.0]
    q-local-diag: [1.0, 1.0]
runtime:
  node-id: Runtime
  max-worker-threads: 2
  blas-threads: 1
  torch-threads: 1
  cpu-affinity: []
  set-env: true
